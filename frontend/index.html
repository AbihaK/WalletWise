<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalletWise</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>WalletWise</h1>
    <p>Smart spending for students</p>
  </header>

  <main>
    <section class="card">
      <h2>Add Expense</h2>
      <textarea id="sms" placeholder="Paste a bank or UPI message here..."></textarea>
      <button id="parseBtn">Parse and Save</button>
      <p class="or">or add manually</p>
      <div class="row">
        <input id="amount" type="number" placeholder="Amount (₹)">
        <input id="merchant" type="text" placeholder="Merchant">
        <button id="addBtn">Add</button>
      </div>
      <p id="msg"></p>
    </section>

    <section class="card">
      <h2>Monthly Budget</h2>
      <div class="row">
        <input id="budget" type="number" placeholder="e.g. 5000">
        <button id="budgetBtn">Set</button>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <p id="budgetText"></p>
      <p id="alert" class="alert"></p>
    </section>

    <section class="card">
      <h2>Spending by Category</h2>
      <canvas id="pie"></canvas>
    </section>

    <section class="card">
      <h2>Last 7 Days</h2>
      <canvas id="bar"></canvas>
    </section>

    <section class="card">
      <h2>Insights</h2>
      <ul id="insights"></ul>
    </section>

    <section class="card wide">
      <h2>Transactions</h2>
      <select id="filter"><option value="">All categories</option></select>
      <table>
        <thead>
          <tr><th>Date</th><th>Merchant</th><th>Category</th><th>Amount</th><th></th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
